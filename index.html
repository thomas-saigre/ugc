  <button class="city-button" onclick="jumpToCity(48.5797, 7.7521, 15)">Strasbourg</button>
  <button class="city-button" onclick="jumpToCity(48.8566, 2.3522, 12)">Paris</button>

  <button class="city-button" onclick="searchLocation()">Go</button>
</div>
<script>
function jumpToCity(lat, lng, zoom) { map_efccaacbe8d9085652a7e3b80ccf30bc.setView([lat, lng], zoom); }
function searchLocation() {
  var query = document.getElementById('search-input').value;
  if (!query) return;
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.length > 0) {
        map_efccaacbe8d9085652a7e3b80ccf30bc.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 15);
      } else { alert('Lieu introuvable.'); }
    })
    .catch(function () { alert('Erreur pendant la recherche.'); });
}
document.addEventListener('DOMContentLoaded', function () {
  var input = document.getElementById('search-input');
  if (input) input.addEventListener('keydown', function (e) { if (e.key === 'Enter') searchLocation(); });
});
</script>
